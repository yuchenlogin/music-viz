name: daily-update

on:
  schedule:
    # 每天 UTC 22:00（北京时间 06:00）抓一次数据
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      playlist_id:
        description: '要抓取的歌单 ID（留空用默认 710883180）'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取歌单数据
        env:
          NCM_PLAYLIST_ID: ${{ inputs.playlist_id || '710883180' }}
        run: |
          python3 scripts/fetch_playlist.py
          # 同步到 public/ 让构建带出
          cp -r data/* public/data/
          # 热插拔：手动触发的非默认歌单 → 存到 data/external/<id>.json
          # 前端 ?id=xxx 时优先加载该文件
          if [ -n "${{ inputs.playlist_id }}" ] && [ "${{ inputs.playlist_id }}" != "710883180" ]; then
            mkdir -p public/data/external
            cp data/latest.json "public/data/external/${{ inputs.playlist_id }}.json"
          fi

      - name: 提交数据更新（若有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ public/data/
          git diff --cached --quiet || git commit -m "chore: 每日歌单数据更新 $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 构建
        run: npm run build

      - name: 部署到 GitHub Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
